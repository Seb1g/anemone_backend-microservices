services:
  # --- DATABASES (порты закрыты для внешней среды) ---
  db-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - micro-network

  db-kanban:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kanban_db
    volumes:
      - kanban_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kanban_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - micro-network

  db-mail:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mail_db
    volumes:
      - mail_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mail_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - micro-network

  db-note:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: note_db
    volumes:
      - note_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d note_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - micro-network

  db-catechize:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: catechize_db
    volumes:
      - catechize_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d catechize_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - micro-network

  # --- MICROSERVICES ---
  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"
    environment:
      DB_URL: postgres://user:password@db-auth:5432/auth_db?sslmode=disable
    depends_on:
      db-auth:
        condition: service_healthy
    networks:
      - micro-network
    env_file:
      - internal/auth/.env

  kanban-service:
    build:
      context: .
      args:
        SERVICE_NAME: kanban
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanban.rule=PathPrefix(`/api/v1/trello`)"
      - "traefik.http.services.kanban.loadbalancer.server.port=8081"
    environment:
      DB_URL: postgres://user:password@db-kanban:5432/kanban_db?sslmode=disable
    depends_on:
      db-kanban:
        condition: service_healthy
    networks:
      - micro-network
    env_file:
      - internal/kanban/.env

  mail-service:
    build:
      context: .
      args:
        SERVICE_NAME: mail
    ports:
      - "25:25"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=PathPrefix(`/api/v1/mail`)"
      - "traefik.http.services.mail.loadbalancer.server.port=8082"
    environment:
      DB_URL: postgres://user:password@db-mail:5432/mail_db?sslmode=disable
    depends_on:
      db-mail:
        condition: service_healthy
    networks:
      - micro-network
    env_file:
      - internal/mail/.env

  note-service:
    build:
      context: .
      args:
        SERVICE_NAME: notes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notes.rule=PathPrefix(`/api/v1/notes`)"
      - "traefik.http.services.notes.loadbalancer.server.port=8083"
    environment:
      DB_URL: postgres://user:password@db-note:5432/note_db?sslmode=disable
    depends_on:
      db-note:
        condition: service_healthy
    networks:
      - micro-network
    env_file:
      - internal/notes/.env

  catechize-service:
    build:
      context: .
      args:
        SERVICE_NAME: catechize
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catechize.rule=PathPrefix(`/api/v1/quiz`)"
      - "traefik.http.services.catechize.loadbalancer.server.port=8084"
    environment:
      DB_URL: postgres://user:password@db-catechize:5432/catechize_db?sslmode=disable
    depends_on:
      db-catechize:
        condition: service_healthy
    networks:
      - micro-network
    env_file:
      - internal/catechize/.env

  gateway:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8089:8080"   # Дашборд Traefik (открой http://localhost:8089)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge

volumes:
  auth_data:
  kanban_data:
  mail_data:
  note_data:
  catechize_data:
